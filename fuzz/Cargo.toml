[package]
name = "re-kem-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
re-kem-core = { path = ".." }

[[bin]]
name = "ntt_algebra"
path = "fuzz_targets/ntt_algebra.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
overflow-checks = true

# Eigenes Workspace-Wurzelverzeichnis, damit der Fuzz-Bau den Hauptbau nicht stört.
[workspace]
