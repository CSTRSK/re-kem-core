[package]
name = "re-kem-core"
version = "0.2.0"
edition = "2021"
description = "Constant-time Ring-LWE KEM (RE-KEM) — full Rust port of the Python reference"
license = "AGPL-3.0"

[dependencies]
subtle = { version = "2", default-features = false }
sha3 = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false }
getrandom = { version = "0.2", optional = true }
# Hybride (experimentell), beide Features standardmaessig AUS.
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
ml-kem = { version = "0.3.4", default-features = false, features = ["alloc"], optional = true }

[features]
default = ["std", "rng"]
# Nur fuer die Fault-Injection-Tests: haengt einen Stoerhaken in den
# Entkapselungs-Zwischenvektor. Im Normalbau nicht enthalten.
fia-hooks = [ ]
std = []
rng = ["dep:getrandom", "getrandom/std"]
# Hybrid-KEMs: RE-KEM-512 + X25519 / ML-KEM-768 + X25519. Experimentell.
hybrid-rekem-x25519 = ["dep:x25519-dalek"]
hybrid-mlkem-x25519 = ["dep:x25519-dalek", "dep:ml-kem"]

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
